{% extends "base.html" %}
{% set space = none %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="solo">
  <h1>Bon retour</h1>
  <form method="post" class="sheet">
    {{ csrf_field() }}
    <label>E-mail <input type="email" name="email" required autofocus autocomplete="email" value="{{ request.form.email }}"></label>
    <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-lg btn-block">Se connecter</button>
  </form>
  <p class="muted small">Pas encore de compte ? <a href="{{ url_for('auth.register') }}">Crée-le en trois phrases</a></p>
</div>
{% endblock %}
