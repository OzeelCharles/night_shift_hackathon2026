<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors ligne | Rivezli</title>
  <meta name="theme-color" content="#fcf4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17161f" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="offline" id="contenu">
  <img src="{{ url_for('static', filename='logo.png') }}" alt="" width="96" height="96">
  <h1>Tu es hors ligne</h1>
  <p>Rivezli a besoin d'une connexion pour afficher ton planning, tes notes et tes révisions. Rien n'est perdu : tout est
    gardé sur ton compte, et reviendra dès que le réseau sera de retour.</p>
  <p class="actions"><button class="btn btn-lg" type="button" id="retry">Réessayer</button></p>
</main>
<script nonce="{{ csp_nonce() }}">document.getElementById("retry").addEventListener("click", () => location.reload());</script>
</body>
</html>
