{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Connexion</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>E-mail <input type="email" name="email" required autofocus value="{{ request.form.email }}"></label>
    <label>Mot de passe <input type="password" name="password" required></label>
    <button class="btn">Se connecter</button>
  </form>
  <p class="muted">Pas encore de compte ? <a href="{{ url_for('auth.register') }}">Inscris-toi</a>.</p>
</div>
{% endblock %}
