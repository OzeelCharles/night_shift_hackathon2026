{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Créer un compte</h1>
  <p class="muted">Ton niveau et ton établissement servent à te proposer des ressources adaptées. Tu pourras les changer à tout moment.</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Nom d'utilisateur <input name="username" required minlength="2" maxlength="40" autocomplete="nickname" value="{{ request.form.username }}"></label>
    <label>E-mail <input type="email" name="email" required autocomplete="email" value="{{ request.form.email }}"></label>
    <label>Niveau d'études
      <select name="level" required>
        <option value="" disabled {% if not request.form.level %}selected{% endif %}>Choisis ton niveau</option>
        {% for key, label in levels.items() %}
        <option value="{{ key }}" {% if request.form.level == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select></label>
    <label>École ou université
      <input name="school" required minlength="2" maxlength="120" list="schools" placeholder="ENSAI, Université de Rennes, lycée Chateaubriand…" value="{{ request.form.school }}"></label>
    <datalist id="schools">{% for s in schools %}<option value="{{ s }}">{% endfor %}</datalist>
    <label>Mot de passe (8 caractères min.) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirmation <input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
    <button class="btn btn-block">Créer mon compte</button>
  </form>
</div>
{% endblock %}
