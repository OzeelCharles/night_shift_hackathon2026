{# Styles propres à l'atelier : ils réutilisent les variables du thème (clair et sombre) de style.css #}
<style>
  .rv-tabs { margin-bottom: 20px; }
  .rv-quote { margin: 8px 0 14px; padding: 10px 16px; border-left: 3px solid var(--margin); background: var(--ink-soft); border-radius: 0 8px 8px 0; max-width: 80ch; }
  .rv-q { border-top: 1px solid var(--line); padding: 20px 0 8px; }
  .rv-q:first-of-type { border-top: 0; }
  .rv-q h3 { margin: 0 0 4px; }
  .rv-opts { display: grid; gap: 8px; max-width: 720px; }
  .rv-opt { flex-direction: row; align-items: center; gap: 12px; margin: 0; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 8px; font-weight: 400; cursor: pointer; }
  .rv-opt:has(input:checked) { border-color: var(--ink); background: var(--ink-soft); }
  .rv-opt.is-right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .rv-opt.is-wrong { border-color: var(--margin); background: color-mix(in srgb, var(--margin) 10%, transparent); }
  .rv-opt .rv-mark { margin-left: auto; font-weight: 700; font-size: .85rem; }
  .rv-explain { font-size: .92rem; color: var(--muted); margin-top: 8px; }
  .rv-big { font-size: 3rem; font-weight: 700; color: var(--ink); line-height: 1; }
  .rv-chart { display: block; width: 100%; height: auto; max-width: 760px; }
  .rv-chart .grid line { stroke: var(--line); stroke-width: 1; }
  .rv-chart .grid line.mid { stroke: var(--seyes-strong); stroke-dasharray: 4 4; }
  .rv-chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
  .rv-chart .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .rv-chart .dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; transition: r .1s; }
  .rv-chart .pt:hover .dot, .rv-chart .pt:focus .dot { r: 7; }
  .rv-chart .hit { fill: transparent; }
  .rv-chart .val { fill: var(--graphite); font-weight: 700; font-size: 12px; }
  .rv-spark { width: 120px; height: 32px; }
  .rv-spark polyline { fill: none; stroke: var(--ink); stroke-width: 2; }
  .rv-bars { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .rv-bars li { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr auto; gap: 12px; align-items: center; font-size: .92rem; }
  .rv-bar { height: 10px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .rv-bar span { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
  .rv-bar.is-weak span { background: var(--margin); }
  .rv-sheet dt { font-weight: 700; margin-top: 10px; }
  .rv-sheet dd { margin: 2px 0 0; }
  .rv-sheet code { display: inline-block; padding: 4px 10px; margin: 0 6px 6px 0; border-radius: 6px; background: var(--ink-soft); font-size: .95rem; }
  .rv-card-flip { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .rv-card-flip summary { cursor: pointer; font-weight: 700; }
  .rv-ex { border-top: 1px solid var(--line); padding: 14px 0; }
  .rv-text { white-space: pre-wrap; margin: 8px 0; }
  .rv-text .katex-display { white-space: normal; margin: .6em 0; }
  .katex { font-size: 1.05em; }
  .rv-nb { display: flex; justify-content: space-between; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding: 10px 0; }
  .rv-levels-table td { padding: 6px 8px; vertical-align: middle; }
  .rv-levels-table select { min-height: 38px; padding: 6px 10px; }
  @media (max-width: 720px) { .rv-bars li { grid-template-columns: 1fr; gap: 4px; } }
  @media print {
    .topbar, .rv-noprint, .flashes, .notice { display: none !important; }
    .card { border: 0; padding: 0; break-inside: avoid; }
    .rv-card-flip[open] summary ~ *, .rv-card-flip summary ~ * { display: block; }
  }
</style>
{# Formules en LaTeX ($…$, $$…$$, \(…\), \[…\]) rendues par KaTeX #}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
        onload="renderMathInElement(document.querySelector('main'), {throwOnError: false, delimiters: [
          {left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true},
          {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]})"></script>
